name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.0) or "auto" to increment'
        required: true
        default: 'auto'
        type: string
      pre_release:
        description: 'Pre-release type'
        required: true
        type: choice
        options:
          - stable
          - alpha
          - beta

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine new version
        id: version
        run: |
          CURRENT=$(grep '^version = ' build.gradle | sed 's/version = "\(.*\)"/\1/')
          CURRENT_BASE=$(echo "$CURRENT" | sed 's/-alpha$//' | sed 's/-beta$//')

          if [ "${{ inputs.version }}" = "auto" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_BASE"
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -ge 10 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
              if [ "$MINOR" -ge 10 ]; then
                MINOR=0
                MAJOR=$((MAJOR + 1))
              fi
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            NEW_VERSION="${{ inputs.version }}"
          fi

          SUFFIX=""
          if [ "${{ inputs.pre_release }}" = "alpha" ]; then
            SUFFIX="-alpha"
          elif [ "${{ inputs.pre_release }}" = "beta" ]; then
            SUFFIX="-beta"
          fi

          FULL_VERSION="${NEW_VERSION}${SUFFIX}"
          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ "${{ inputs.pre_release }}" != "stable" ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          ADDED=""
          CHANGED=""
          FIXED=""
          OTHER=""

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s" "${LAST_TAG}..HEAD")
          fi

          while IFS= read -r commit; do
            [ -z "$commit" ] && continue

            if [[ "$commit" =~ ^feat(\(.+\))?:[[:space:]](.+)$ ]]; then
              MSG="${BASH_REMATCH[2]}"
              ADDED="${ADDED}- ${MSG}"$'\n'
            elif [[ "$commit" =~ ^fix(\(.+\))?:[[:space:]](.+)$ ]]; then
              MSG="${BASH_REMATCH[2]}"
              FIXED="${FIXED}- ${MSG}"$'\n'
            elif [[ "$commit" =~ ^(refactor|perf|chore)(\(.+\))?:[[:space:]](.+)$ ]]; then
              MSG="${BASH_REMATCH[3]}"
              CHANGED="${CHANGED}- ${MSG}"$'\n'
            else
              OTHER="${OTHER}- ${commit}"$'\n'
            fi
          done <<< "$COMMITS"

          BODY=""
          if [ -n "$ADDED" ]; then BODY="${BODY}### Added"$'\n'"${ADDED}"$'\n'; fi
          if [ -n "$CHANGED" ]; then BODY="${BODY}### Changed"$'\n'"${CHANGED}"$'\n'; fi
          if [ -n "$FIXED" ]; then BODY="${BODY}### Fixed"$'\n'"${FIXED}"$'\n'; fi
          if [ -n "$OTHER" ]; then BODY="${BODY}### Other changes"$'\n'"${OTHER}"$'\n'; fi

          if [ -z "$BODY" ]; then
            BODY="No documented changes in this release."
          fi

          echo "$BODY" > changelog.md

      - name: Bump version in all files
        run: |
          NEW="${{ steps.version.outputs.version }}"
          OLD="${{ steps.version.outputs.current }}"

          sed -i "s|^version = \".*\"|version = \"${NEW}\"|" build.gradle
          sed -i "s|SCP_Tools-${OLD}-all\.jar|SCP_Tools-${NEW}-all.jar|g" Dockerfile
          sed -i "s|^export version=\".*\"|export version=\"${NEW}\"|" installer.sh
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"${NEW}\"|" src/main/resources/SCPToolsBot/configs/extra/updates.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle Dockerfile installer.sh src/main/resources/SCPToolsBot/configs/extra/updates.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Build with Gradle Wrapper
        run: ./gradlew shadowjar --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: changelog.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            build/libs/SCP_Tools-${{ steps.version.outputs.version }}-all.jar
